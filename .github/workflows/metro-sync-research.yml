name: Metro Sync Research Queue

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  follow-up-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Process due follow-up research runs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GITHUB_REPO: ${{ github.repository }}
          METRO_SYNC_AUTO_APPLY_GREEN: '1'
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          AUTOMATION_LLM_API_KEY: ${{ secrets.AUTOMATION_LLM_API_KEY }}
          AUTOMATION_LLM_MODEL: ${{ vars.AUTOMATION_LLM_MODEL }}
          AUTOMATION_LLM_BASE_URL: ${{ vars.AUTOMATION_LLM_BASE_URL }}
        run: npm run metro-sync:research-loop -- --max-rounds=8 --limit=8
