name: Automation Apply Run
run-name: Automation apply run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Automation run id to apply
        required: true
        type: string
      reviewer:
        description: Reviewer label recorded on the apply
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automation-apply-${{ github.event.inputs.run_id }}
  cancel-in-progress: false

jobs:
  apply-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Apply automation run and open PR
        id: apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GITHUB_REPO: ${{ github.repository }}
          AUTOMATION_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_GIT_USER_NAME: ${{ vars.AUTOMATION_GIT_USER_NAME }}
          AUTOMATION_GIT_USER_EMAIL: ${{ vars.AUTOMATION_GIT_USER_EMAIL }}
        run: |
          output="$(node scripts/run-ts.js scripts/automation/apply-run.ts "${{ inputs.run_id }}" "${{ inputs.reviewer }}")"
          echo "$output"
          {
            echo 'json<<EOF'
            echo "$output"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write apply summary
        if: always()
        env:
          APPLY_RESULT_JSON: ${{ steps.apply.outputs.json }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_REVIEWER: ${{ inputs.reviewer }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs')

          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          const runId = process.env.INPUT_RUN_ID || ''
          const reviewer = process.env.INPUT_REVIEWER || ''
          const raw = process.env.APPLY_RESULT_JSON || ''

          const lines = [
            '# Automation Apply Run',
            '',
            `- Run: \`${runId}\``,
            `- Reviewer: \`${reviewer}\``,
          ]

          if (raw) {
            try {
              const payload = JSON.parse(raw)
              lines.push(`- Applied candidates: ${payload.appliedCount ?? 0}`)
              lines.push(`- Skipped candidates: ${payload.skippedCount ?? 0}`)
              if (payload.git?.branchName) {
                lines.push(`- Branch: \`${payload.git.branchName}\``)
              }
              if (payload.git?.pullRequestUrl) {
                lines.push(`- PR: ${payload.git.pullRequestUrl}`)
              }
              const warnings = Array.isArray(payload.warnings) ? payload.warnings.filter(Boolean) : []
              if (warnings.length > 0) {
                lines.push('', '## Warnings', ...warnings.map((warning) => `- ${warning}`))
              }
            } catch {
              lines.push('', '## Raw Output', '```json', raw, '```')
            }
          } else {
            lines.push('', 'The apply step did not produce JSON output. Check the step logs above.')
          }

          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`)
          EOF
