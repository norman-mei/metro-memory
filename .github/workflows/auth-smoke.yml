name: Auth Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public site URL to test
        required: true
        default: https://metromemory.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run auth smoke suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
          E2E_AUTH_LOGIN_EMAIL: ${{ secrets.E2E_AUTH_LOGIN_EMAIL }}
          E2E_AUTH_LOGIN_PASSWORD: ${{ secrets.E2E_AUTH_LOGIN_PASSWORD }}
        run: npm run test:e2e -- --grep @smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
