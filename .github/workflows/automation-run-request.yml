name: Automation Run Request
run-name: Automation run request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Automation run request id to execute
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automation-run-request-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  execute-request:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Execute automation run request
        id: execute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GITHUB_REPO: ${{ github.repository }}
          AUTOMATION_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_GIT_USER_NAME: ${{ vars.AUTOMATION_GIT_USER_NAME }}
          AUTOMATION_GIT_USER_EMAIL: ${{ vars.AUTOMATION_GIT_USER_EMAIL }}
          AUTOMATION_LLM_API_KEY: ${{ secrets.AUTOMATION_LLM_API_KEY }}
          AUTOMATION_LLM_MODEL: ${{ vars.AUTOMATION_LLM_MODEL }}
          AUTOMATION_LLM_BASE_URL: ${{ vars.AUTOMATION_LLM_BASE_URL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          METRO_SYNC_ENABLE_BROWSER_COLLECTOR: ${{ vars.METRO_SYNC_ENABLE_BROWSER_COLLECTOR }}
          METRO_SYNC_BROWSER_TIMEOUT_MS: ${{ vars.METRO_SYNC_BROWSER_TIMEOUT_MS }}
          METRO_SYNC_ENABLE_MEMORY: ${{ vars.METRO_SYNC_ENABLE_MEMORY }}
          METRO_SYNC_DEEP_RESEARCH_MODE: ${{ vars.METRO_SYNC_DEEP_RESEARCH_MODE }}
          METRO_SYNC_AUTO_APPLY_GREEN: ${{ vars.METRO_SYNC_AUTO_APPLY_GREEN }}
          METRO_SYNC_MAX_CITIES_PER_RUN: ${{ vars.METRO_SYNC_MAX_CITIES_PER_RUN }}
          METRO_SYNC_MAX_RESEARCH_TASKS_PER_RUN: ${{ vars.METRO_SYNC_MAX_RESEARCH_TASKS_PER_RUN }}
          METRO_SYNC_MAX_FETCHES_PER_DOMAIN: ${{ vars.METRO_SYNC_MAX_FETCHES_PER_DOMAIN }}
          METRO_SYNC_HTTP_TIMEOUT_MS: ${{ vars.METRO_SYNC_HTTP_TIMEOUT_MS }}
          AUTOMATION_LLM_TIMEOUT_MS: ${{ vars.AUTOMATION_LLM_TIMEOUT_MS }}
          AUTOMATION_TIMEOUT_CEILING_MS: ${{ vars.AUTOMATION_TIMEOUT_CEILING_MS }}
        run: |
          output="$(node scripts/run-ts.js scripts/automation/execute-run-request.ts "${{ inputs.request_id }}")"
          echo "$output"
          {
            echo 'json<<EOF'
            echo "$output"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        env:
          EXECUTION_JSON: ${{ steps.execute.outputs.json }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs')

          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          const requestId = process.env.REQUEST_ID || ''
          const raw = process.env.EXECUTION_JSON || ''
          const lines = [
            '# Automation Run Request',
            '',
            `- Request: \`${requestId}\``,
          ]

          if (raw) {
            try {
              const payload = JSON.parse(raw)
              lines.push(`- Status: \`${payload.status || 'unknown'}\``)
              lines.push(`- Run id: \`${payload.runId || 'none'}\``)
              lines.push(`- Cities: ${payload.cityCount ?? 0}`)
              lines.push(`- Errors: ${payload.errorCount ?? 0}`)
              if (payload.telemetry?.durationMs) {
                lines.push(`- Duration: ${payload.telemetry.durationMs} ms`)
              }
              if (payload.telemetry?.estimatedSpendUsd !== undefined) {
                lines.push(
                  `- Estimated model spend: ${payload.telemetry.estimatedSpendUsd === null ? 'unknown' : `$${Number(payload.telemetry.estimatedSpendUsd).toFixed(4)}`}`,
                )
              }
            } catch {
              lines.push('', '## Raw Output', '```json', raw, '```')
            }
          } else {
            lines.push('', 'Execution step did not return JSON output. Check workflow logs.')
          }

          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`)
          EOF
